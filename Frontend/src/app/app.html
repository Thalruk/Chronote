<div class="flex h-screen bg-white text-gray-900 font-sans overflow-hidden">
  <aside class="w-16 flex flex-col items-center border-r border-gray-200 bg-gray-50 z-10">
    <div class="h-20 flex items-center justify-center w-full shrink-0">
      <div class="font-bold text-5xl text-indigo-600 leading-none" title="Chronote">C</div>
    </div>

    <div class="w-full flex justify-center mt-1">
      <button (click)="openModal()"
        class="w-10 h-10 flex items-center justify-center bg-indigo-600 text-white rounded-xl shadow-sm hover:bg-indigo-700 hover:shadow-md transition-all active:scale-95"
        title="Add task">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
          class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </button>
    </div>
  </aside>
  <main class="flex-1 flex flex-col h-full overflow-hidden bg-gray-50/50">
    <header class="h-20 border-b border-gray-200 flex items-center justify-between px-8 bg-white shrink-0">
      <h1 class="text-2xl font-bold text-gray-800">Your Notes</h1>

      <div class="flex items-center gap-3">
        @if (user(); as currentUser) {
        <div class="w-10 h-10 rounded-full overflow-hidden border border-gray-200 bg-gray-50 flex-shrink-0">
          <img [src]="currentUser.photoUrl" referrerpolicy="no-referrer" alt="Avatar"
            class="w-full h-full object-cover" />
        </div>
        <div class="text-sm text-right flex flex-col justify-center">
          <p class="font-medium text-gray-700 leading-tight">{{ currentUser.firstName }}</p>
          <button (click)="logOut()" class="text-xs text-indigo-600 hover:text-indigo-800 text-right mt-0.5">
            Log Out
          </button>
        </div>
        } @else {
        <asl-google-signin-button type="standard" size="medium"></asl-google-signin-button>
        }
      </div>
    </header>
    @if (isServerWakingUp()) {
    <div
      class="bg-indigo-50 dark:bg-indigo-900/30 border-b border-indigo-100 dark:border-indigo-800 px-4 py-2 flex items-center justify-center gap-3 text-indigo-700 dark:text-indigo-300 text-sm font-medium animate-pulse shrink-0 transition-all">
      <svg class="animate-spin h-4 w-4 text-indigo-600 dark:text-indigo-400" xmlns="http://www.w3.org/2000/svg"
        fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
        </path>
      </svg>
      Connecting to the server. Waking up the backend may take about a minute...
    </div>
    }

    <div class="flex-1 overflow-x-auto overflow-y-hidden p-8">
      <div class="grid grid-cols-6 min-w-full gap-4 h-full group/board" cdkDropListGroup>

        <app-column title="Missed" [notes]="notesMissed()" (dropped)="drop($event, ColumnType.Missed)"
          (delete)="deleteNote($event)" (edit)="openModal($event)"
          (create)="openModalForColumn(ColumnType.Missed)"></app-column>

        <app-column title="Today" [notes]="notesToday()" (dropped)="drop($event, ColumnType.Today)"
          (delete)="deleteNote($event)" (edit)="openModal($event)" (create)="openModalForColumn(ColumnType.Today)">
        </app-column>

        <app-column title="Tomorrow" [notes]="notesTomorrow()" (dropped)="drop($event, ColumnType.Tomorrow)"
          (delete)="deleteNote($event)" (edit)="openModal($event)" (create)="openModalForColumn(ColumnType.Tomorrow)">
        </app-column>

        <app-column title="This week" [notes]="notesThisWeek()" (dropped)="drop($event, ColumnType.ThisWeek)"
          (delete)="deleteNote($event)" (edit)="openModal($event)" (create)="openModalForColumn(ColumnType.ThisWeek)">
        </app-column>

        <app-column title="Next week" [notes]="notesNextWeek()" (dropped)="drop($event, ColumnType.NextWeek)"
          (delete)="deleteNote($event)" (edit)="openModal($event)" (create)="openModalForColumn(ColumnType.NextWeek)">
        </app-column>

        <app-column title="Later" [notes]="notesLater()" (dropped)="drop($event, ColumnType.Later)"
          (delete)="deleteNote($event)" (edit)="openModal($event)" (create)="openModalForColumn(ColumnType.Later)">
        </app-column>
      </div>
    </div>
  </main>
</div>
<app-note-modal [isOpen]="isModalOpen()" [noteData]="editingNote()" (save)="saveNote($event)" (close)="closeModal()">
</app-note-modal>
