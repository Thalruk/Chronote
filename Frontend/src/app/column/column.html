<div
    class="w-80 flex-shrink-0 flex flex-col h-fit self-start bg-gray-100/80 rounded-xl border border-gray-200 group/col">
    <div
        class="px-4 py-3 font-semibold text-gray-800 flex justify-between items-center border-b border-gray-200/60 shrink-0">
        <span>{{ title() }}</span>
        <span class="bg-indigo-100 text-indigo-700 text-xs font-bold py-1 px-2.5 rounded-full">{{ notes().length
            }}</span>
    </div>

    <div class="p-3 space-y-3 min-h-[100px] group" cdkDropList [cdkDropListData]="notes()"
        (cdkDropListDropped)="onDrop($event)">

        @for (note of notes(); track note.id) {
        <div cdkDrag
            class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 cursor-grab active:cursor-grabbing hover:border-indigo-400 hover:shadow-md transition-colors border-l-4 border-l-indigo-500">
            <h3 class="font-medium text-gray-900 text-sm">{{ note.title }}</h3>
            <p class="text-xs text-gray-500 mt-2 line-clamp-2">{{ note.content }}</p>
        </div>
        } @empty {
        <div
            class="text-center py-6 text-sm text-gray-400 font-medium group-has-[.cdk-drag-placeholder]:hidden group-hover/col:hidden">
            No tasks for {{ title().toLowerCase() }}. Enjoy your free time!
        </div>
        }
    </div>

    <div class="p-3 pt-0 shrink-0">
        <button
            class="w-full opacity-0 group-hover/col:opacity-100 group-has-[.cdk-drop-list-dragging]/board:!opacity-0 transition-all duration-200 flex items-center gap-2 py-2 px-3 text-sm font-medium text-gray-600 hover:text-indigo-600 hover:bg-gray-200/60 rounded-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                    d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                    clip-rule="evenodd" />
            </svg>
            Add task
        </button>
    </div>
</div>
